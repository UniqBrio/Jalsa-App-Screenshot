# Branches, from its row on More. Add branch is never pressed; the remove
# control on a row is never pressed.
schema_version: 2
module: more
flow: branches
title: Branches
description: The Branches screen reached from its row on More.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /more
  - /branches

steps:
  - id: 010-more
    action: goto
    value: /more
    label: More
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: 'role=button[name=/^Branches/]'

  # The row's accessible name is "Branches, <count>", so it is matched by prefix.
  - id: 020-open-branches
    action: click
    selector: 'role=button[name=/^Branches/]'
    label: Branches
    expect_screen: branches
    screenshot: full
    settle_ms: 1500
    assert:
      url_contains: /branches

  - id: 030-back
    action: click
    selector: '[data-testid="screen-back"]'
    label: Back to More
    expect_screen: more
    screenshot: false
    settle_ms: 1000
