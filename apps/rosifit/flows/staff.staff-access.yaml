# Staff & access (super admin only) and the Add staff form, opened and closed.
# staff-save is never pressed; the remove control on a row is never pressed.
schema_version: 2
module: staff
flow: staff-access
title: Staff & access
description: The staff list from its row on More, and the Add staff form opened and closed without saving.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /more
  - /staff
  - /staff/add

steps:
  - id: 010-more
    action: goto
    value: /more
    label: More
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: 'role=button[name=/^Staff & access/]'

  - id: 020-open-staff
    action: click
    selector: 'role=button[name=/^Staff & access/]'
    label: Staff & access
    expect_screen: staff
    screenshot: full
    settle_ms: 1800
    assert:
      url_contains: /staff
      selector_visible: '[data-testid="staff-add"]'

  - id: 030-add-staff-form
    action: click
    selector: '[data-testid="staff-add"]'
    label: Add staff — the empty form (never saved)
    expect_screen: staff-add-form
    screenshot: full
    settle_ms: 1200
    assert:
      url_contains: /staff/add

  - id: 040-close-form
    action: click
    selector: '[data-testid="dialog-close"]'
    label: Close without saving
    expect_screen: staff
    screenshot: false
    settle_ms: 800
    optional: true
