# The Attendance tab's landing screen — the course list — and the two forms
# its header opens. Forms are OPENED and CLOSED, never saved.
schema_version: 2
module: attendance
flow: courses-workspace
title: Attendance workspace (course list)
description: The Attendance tab, its course cards with their actions, and the Add Course form opened and closed without saving.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 600

depends_on_routes:
  - /
  - /courses
  - /course/edit

steps:
  - id: 010-overview
    action: goto
    value: /
    label: Start on Overview
    screenshot: false
    settle_ms: 1200
    assert:
      selector_visible: '[data-testid="nav-tab-attendance"]'

  # The header's underline tab, not a URL: tapping is how a person gets here,
  # and the navigator's own switch is what keeps the shell from stacking.
  - id: 020-attendance-tab
    action: click
    selector: '[data-testid="nav-tab-attendance"]'
    label: The Attendance tab — the course list
    expect_screen: courses
    screenshot: full
    settle_ms: 1500
    assert:
      url_contains: /courses
      selector_visible: '[data-testid="courses-add"]'

  - id: 030-add-course-form
    action: click
    selector: '[data-testid="courses-add"]'
    label: Add Course — the empty course form (never saved)
    expect_screen: course-form-empty
    screenshot: full
    settle_ms: 1200
    assert:
      selector_visible: '[data-testid="course-close"]'

  - id: 040-close-course-form
    action: click
    selector: '[data-testid="course-close"]'
    label: Close without saving
    expect_screen: courses
    screenshot: false
    settle_ms: 800

  # Edit on the first course card opens the same form filled in.
  - id: 050-edit-course-form
    action: click
    selector: '[data-testid^="courses-edit-"]'
    label: Edit — the course form filled in (never saved)
    expect_screen: course-form-filled
    screenshot: full
    settle_ms: 1500
    assert:
      selector_visible: '[data-testid="course-close"]'

  - id: 060-close-edit-form
    action: click
    selector: '[data-testid="course-close"]'
    label: Close without saving
    expect_screen: courses
    screenshot: false
    settle_ms: 800

  - id: 070-add-member-form
    action: click
    selector: '[data-testid="courses-add-member"]'
    label: Add Member from the workspace — the member form (never saved)
    expect_screen: member-form-empty
    screenshot: full
    settle_ms: 1200
    assert:
      selector_visible: '[data-testid="member-close"]'

  - id: 080-close-member-form
    action: click
    selector: '[data-testid="member-close"]'
    label: Close without saving
    expect_screen: courses
    screenshot: false
    settle_ms: 800
