# The bell in the academy header and the sheet it opens.
schema_version: 2
module: notifications
flow: notification-panel
title: Notifications
description: The bell in the header, the notifications sheet, and closing it.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 500

depends_on_routes:
  - /

steps:
  - id: 010-overview
    action: goto
    value: /
    label: Overview, with the bell in the header
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: '[data-testid="shell-notifications"]'

  - id: 020-open-notifications
    action: click
    selector: '[data-testid="shell-notifications"]'
    label: The notifications sheet
    expect_screen: notifications-sheet
    screenshot: viewport
    settle_ms: 800
    assert:
      selector_visible: 'role=button[name="Close Notifications"]'

  # The scrim behind the sheet is its close control.
  - id: 030-close-notifications
    action: click
    selector: 'role=button[name="Close Notifications"]'
    label: Close the sheet
    expect_screen: overview
    screenshot: false
