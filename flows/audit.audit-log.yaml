# The audit log (super admin only) and its filters. Remarks are never added.
schema_version: 2
module: audit
flow: audit-log
title: Audit log
description: The audit log from its row on More, its period and branch filters opened and closed, and the table scrolled.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /more
  - /audit

steps:
  - id: 010-more
    action: goto
    value: /more
    label: More
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: 'role=button[name=/^Audit log/]'

  - id: 020-open-audit
    action: click
    selector: 'role=button[name=/^Audit log/]'
    label: Audit log
    expect_screen: audit
    screenshot: full
    settle_ms: 2000
    assert:
      url_contains: /audit

  - id: 030-open-period
    action: click
    selector: '[data-testid="audit-filter-period"]'
    label: The Period filter
    expect_screen: audit-period-filter
    screenshot: viewport
    optional: true

  - id: 035-close-period
    action: click
    selector: '[data-testid="audit-filter-dismiss"]'
    label: Close
    screenshot: false
    optional: true

  - id: 040-open-branch
    action: click
    selector: '[data-testid="audit-filter-branch"]'
    label: The Branch filter
    expect_screen: audit-branch-filter
    screenshot: viewport
    optional: true

  - id: 045-close-branch
    action: click
    selector: '[data-testid="audit-filter-dismiss"]'
    label: Close
    screenshot: false
    optional: true

  - id: 050-scroll
    action: scrollTo
    position: bottom
    label: The end of the log
    expect_screen: audit-end
    screenshot: viewport
