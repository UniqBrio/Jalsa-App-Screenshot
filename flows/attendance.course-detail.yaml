# One course, opened from its card: the week strip, the two dropdowns, the
# member search and a member row. Everything here is a read.
#
# The first course card is used unless FIXED_COURSE_ID pins one. Prefix
# selectors are on-policy (`^=` is an allowed attribute operator).
schema_version: 2
module: attendance
flow: course-detail
title: Course detail (week strip and roster)
description: Open the first course, step the week strip back and forward, open the Branch and Show dropdowns, search the roster, open one member.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /courses
  - /course/[id]
  - /member/[id]

steps:
  - id: 010-courses
    action: goto
    value: /courses
    label: The course list
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: '[data-testid^="courses-open-"]'

  - id: 020-open-course
    action: click
    selector: '[data-testid^="courses-open-"]'
    label: Open the first course
    expect_screen: course-detail
    screenshot: full
    settle_ms: 2000
    assert:
      url_contains: /course/
      selector_visible: '[data-testid="course-back"]'

  - id: 030-previous-week
    action: click
    selector: '[data-testid="course-week-prev"]'
    label: The previous week
    expect_screen: course-previous-week
    screenshot: viewport
    settle_ms: 1500

  - id: 040-next-week
    action: click
    selector: '[data-testid="course-week-next"]'
    label: Back to the current week
    screenshot: false
    settle_ms: 1200

  # Day cells are course-day-<YYYY-MM-DD>; the prefix "course-day-2" keeps
  # course-day-reset / -add- / -upload- out of the match.
  - id: 050-select-day
    action: click
    selector: '[data-testid^="course-day-2"]'
    label: A day on the strip — that session's attendance
    expect_screen: course-day-selected
    screenshot: viewport
    settle_ms: 1500
    optional: true

  - id: 060-open-branch
    action: click
    selector: '[data-testid="course-branch-field"]'
    label: The Branch dropdown
    expect_screen: course-branch-dropdown
    screenshot: viewport
    optional: true

  - id: 065-close-branch
    action: click
    selector: '[data-testid="course-branch-dismiss"]'
    label: Close the Branch dropdown
    screenshot: false
    optional: true

  - id: 070-open-show
    action: click
    selector: '[data-testid="course-show-field"]'
    label: The Show dropdown — which members to list
    expect_screen: course-show-dropdown
    screenshot: viewport
    assert:
      selector_visible: '[data-testid="course-show-all"]'

  - id: 075-close-show
    action: click
    selector: '[data-testid="course-show-dismiss"]'
    label: Close the Show dropdown
    screenshot: false

  - id: 080-search-roster
    action: type
    selector: '[data-testid="course-member-search"]'
    value: a
    run_tag: false
    label: Search the roster
    expect_screen: course-roster-searched
    screenshot: viewport

  - id: 085-clear-search
    action: press
    selector: '[data-testid="course-member-search"]'
    value: Backspace
    label: Clear the search
    screenshot: false

  # A member row's accessible name is "<name>, active. <email>. <miss line>".
  - id: 090-open-member
    action: click
    selector: 'role=button[name=/, (active|inactive)\. /]'
    label: Open a member from the roster
    expect_screen: member-detail
    screenshot: viewport
    settle_ms: 1500
    assert:
      url_contains: /member/
      selector_visible: '[data-testid="member-close"]'

  - id: 095-close-member
    action: click
    selector: '[data-testid="member-close"]'
    label: Close the member
    screenshot: false
    settle_ms: 800

  - id: 100-back-to-courses
    action: click
    selector: '[data-testid="course-back"]'
    label: Back to the course list
    expect_screen: courses
    screenshot: false
    settle_ms: 1000
