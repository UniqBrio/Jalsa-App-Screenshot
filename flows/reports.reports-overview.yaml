# Reports — the period filter and each scope. Export is never pressed (it
# writes a file to the machine, which is noise, not a screen).
schema_version: 2
module: reports
flow: reports-overview
title: Reports
description: The Reports screen, its period filter, and each report scope.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /reports

steps:
  - id: 010-reports
    action: goto
    value: /reports
    label: Reports
    expect_screen: reports
    screenshot: full
    settle_ms: 1800
    assert:
      selector_visible: '[data-testid="reports-filter-period"]'

  - id: 020-open-period
    action: click
    selector: '[data-testid="reports-filter-period"]'
    label: The Period filter
    expect_screen: reports-period-filter
    screenshot: viewport
    assert:
      selector_visible: '[data-testid="reports-period-this-week"]'

  - id: 025-close-period
    action: click
    selector: '[data-testid="reports-filter-dismiss"]'
    label: Close
    screenshot: false

  - id: 030-scope-members
    action: click
    selector: '[data-testid="reports-scope-members"]'
    label: Scope — members
    expect_screen: reports-members
    screenshot: full
    settle_ms: 1200
    optional: true

  - id: 040-scope-courses
    action: click
    selector: '[data-testid="reports-scope-courses"]'
    label: Scope — courses
    expect_screen: reports-courses
    screenshot: full
    settle_ms: 1200
    optional: true
