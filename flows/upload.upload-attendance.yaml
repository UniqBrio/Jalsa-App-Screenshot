# The Upload attendance dialog — captured at its first step only. No file is
# ever chosen, so nothing is ever uploaded.
schema_version: 2
module: upload
flow: upload-attendance
title: Upload attendance (first step)
description: The upload dialog as it opens — choosing the course and session — with no file chosen.
scenario_class: happy
auth: admin
audience: academy owner
settle_ms: 700

depends_on_routes:
  - /courses
  - /upload

steps:
  - id: 010-courses
    action: goto
    value: /courses
    label: The course list
    screenshot: false
    settle_ms: 1500
    assert:
      selector_visible: '[data-testid^="courses-open-"]'

  - id: 020-open-course
    action: click
    selector: '[data-testid^="courses-open-"]'
    label: Open the first course
    screenshot: false
    settle_ms: 2000
    assert:
      selector_visible: '[data-testid="course-upload"]'

  - id: 030-upload-dialog
    action: click
    selector: '[data-testid="course-upload"]'
    label: Upload Session — the upload dialog, nothing chosen
    expect_screen: upload-choose
    screenshot: full
    settle_ms: 1500
    assert:
      url_contains: /upload

  - id: 040-close
    action: goBack
    label: Leave without uploading
    expect_screen: course-detail
    screenshot: false
    settle_ms: 1000
